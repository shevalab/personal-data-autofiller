<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autofiller Test — 4 Passengers with per-person email &amp; phone (dynamic)</title>
  <style>
    :root { font-family: system-ui, sans-serif; background: #f3f6f9; color: #17202a; }
    body { margin: 0; padding: 32px 16px; }
    main { max-width: 1040px; margin: 0 auto; }
    h1 { margin-top: 0; }
    form { display: grid; gap: 20px; }
    fieldset { border: 1px solid #cbd5df; border-radius: 8px; background: #fff; padding: 20px; }
    legend { padding: 0 8px; font-weight: 700; }
    .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
    label { display: grid; gap: 6px; font-weight: 600; }
    input, select { box-sizing: border-box; width: 100%; border: 1px solid #9aa7b2; border-radius: 4px; padding: 9px 10px; font: inherit; }
    #eventLog { min-height: 48px; margin: 0; padding: 12px; overflow: auto; background: #17202a; color: #d8e2eb; border-radius: 4px; white-space: pre-wrap; }
    button { width: fit-content; padding: 10px 16px; border: 0; border-radius: 4px; background: #1769aa; color: #fff; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Autofiller Test Form — 4 Passengers with per-person email &amp; phone (dynamic)</h1>
    <p class="intro">Fields are generated by JavaScript at load time. Same four passengers (<code>pax1_*</code>, <code>traveler_2_*</code>, <code>guest3_*</code>, <code>adult4_*</code>), each with its own email &amp; phone.</p>

    <form id="testForm"></form>
  </main>

  <script>
    const COUNTRIES = ['US', 'GB', 'DE', 'FR', 'CA', 'IL'];
    const COUNTRY_OPTIONS = `<option value="">Choose</option>` +
      COUNTRIES.map((c) => `<option value="${c}">${c}</option>`).join('');
    const GENDER_OPTIONS = `<option value="">—</option><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option>`;

    // Each passenger definition mirrors test-form-4p field subsets, plus per-person email & phone.
    const PASSENGERS = [
      {
        legend: 'Passenger 1 — pax1',
        fields: [
          { label: 'Full name', name: 'pax1_full_name', autocomplete: 'name', placeholder: 'Full name' },
          { label: 'First name', name: 'pax1_first_name', autocomplete: 'given-name', placeholder: 'First name' },
          { label: 'Last name', name: 'pax1_last_name', autocomplete: 'family-name', placeholder: 'Last name' },
          { label: 'Passport number', name: 'pax1_passport_number', placeholder: 'Passport number' },
          { label: 'Date of birth', name: 'pax1_date_of_birth', type: 'date', autocomplete: 'bday' },
          { label: 'Nationality', name: 'pax1_nationality', type: 'select', autocomplete: 'country-name', options: COUNTRY_OPTIONS },
          { label: 'Email', name: 'pax1_email', type: 'email', autocomplete: 'email', placeholder: 'Email address' },
          { label: 'Phone', name: 'pax1_phone', type: 'tel', autocomplete: 'tel', placeholder: 'Phone number' }
        ]
      },
      {
        legend: 'Passenger 2 — traveler_2',
        fields: [
          { label: 'Title', name: 'traveler_2_title', type: 'select', autocomplete: 'honorific-prefix', options: `<option value="">—</option><option value="Mr">Mr</option><option value="Mrs">Mrs</option><option value="Ms">Ms</option><option value="Dr">Dr</option>` },
          { label: 'First name', name: 'traveler_2_first_name', autocomplete: 'given-name', placeholder: 'First name' },
          { label: 'Last name', name: 'traveler_2_last_name', autocomplete: 'family-name', placeholder: 'Last name' },
          { label: 'Gender', name: 'traveler_2_gender', type: 'select', autocomplete: 'sex', options: GENDER_OPTIONS },
          { label: 'Passport number', name: 'traveler_2_passport_number', placeholder: 'Passport number' },
          { label: 'Passport issued at', name: 'traveler_2_passport_issued_at', type: 'date' },
          { label: 'Passport expires at', name: 'traveler_2_passport_expires_at', type: 'date' },
          { label: 'Issuing country', name: 'traveler_2_issuing_country', type: 'select', options: COUNTRY_OPTIONS },
          { label: 'Date of birth', name: 'traveler_2_date_of_birth', type: 'date', autocomplete: 'bday' },
          { label: 'Nationality', name: 'traveler_2_nationality', type: 'select', autocomplete: 'country-name', options: COUNTRY_OPTIONS },
          { label: 'Email', name: 'traveler_2_email', type: 'email', autocomplete: 'email', placeholder: 'Email address' },
          { label: 'Phone', name: 'traveler_2_phone', type: 'tel', autocomplete: 'tel', placeholder: 'Phone number' }
        ]
      },
      {
        legend: 'Passenger 3 — guest3',
        fields: [
          { label: 'Full name', name: 'guest3_name', autocomplete: 'name', placeholder: 'Full name' },
          { label: 'Gender', name: 'guest3_sex', type: 'select', autocomplete: 'sex', options: GENDER_OPTIONS },
          { label: 'Passport', name: 'guest3_passport', placeholder: 'Passport' },
          { label: 'DOB', name: 'guest3_dob', type: 'date', autocomplete: 'bday' },
          { label: 'Nationality', name: 'guest3_nationality', type: 'select', autocomplete: 'country-name', options: COUNTRY_OPTIONS },
          { label: 'Email', name: 'guest3_email', type: 'email', autocomplete: 'email', placeholder: 'Email address' },
          { label: 'Phone', name: 'guest3_phone', type: 'tel', autocomplete: 'tel', placeholder: 'Phone number' }
        ]
      },
      {
        legend: 'Passenger 4 — adult4',
        fields: [
          { label: 'First name', name: 'adult4_first_name', autocomplete: 'given-name', placeholder: 'First name' },
          { label: 'Middle name', name: 'adult4_middle_name', placeholder: 'Middle name' },
          { label: 'Last name', name: 'adult4_last_name', autocomplete: 'family-name', placeholder: 'Last name' },
          { label: 'Passport number', name: 'adult4_passport_number', placeholder: 'Passport number' },
          { label: 'Date of birth', name: 'adult4_date_of_birth', type: 'date', autocomplete: 'bday' },
          { label: 'Nationality', name: 'adult4_nationality', type: 'select', autocomplete: 'country-name', options: COUNTRY_OPTIONS },
          { label: 'Email', name: 'adult4_email', type: 'email', autocomplete: 'email', placeholder: 'Email address' },
          { label: 'Phone', name: 'adult4_phone', type: 'tel', autocomplete: 'tel', placeholder: 'Phone number' }
        ]
      }
    ];

    function buildField(def) {
      const label = document.createElement('label');
      label.textContent = def.label;
      let control;
      if (def.type === 'select') {
        control = document.createElement('select');
        control.innerHTML = def.options;
      } else {
        control = document.createElement('input');
        control.type = def.type || 'text';
      }
      control.name = def.name;
      if (def.autocomplete) control.setAttribute('autocomplete', def.autocomplete);
      if (def.placeholder) control.placeholder = def.placeholder;
      label.appendChild(control);
      return label;
    }

    const form = document.getElementById('testForm');

    PASSENGERS.forEach((p) => {
      const fieldset = document.createElement('fieldset');
      const legend = document.createElement('legend');
      legend.textContent = p.legend;
      fieldset.appendChild(legend);

      const fields = document.createElement('div');
      fields.className = 'fields';
      p.fields.forEach((def) => fields.appendChild(buildField(def)));
      fieldset.appendChild(fields);
      form.appendChild(fieldset);
    });

    const button = document.createElement('button');
    button.type = 'button';
    button.id = 'showValues';
    button.textContent = 'Show current values';
    form.appendChild(button);

    const log = document.createElement('pre');
    log.id = 'eventLog';
    log.textContent = 'Events will appear here when the extension fills a field.';
    form.appendChild(log);

    const eventLog = log;
    const trackedFields = form.querySelectorAll('input, select');
    trackedFields.forEach((field) => {
      field.addEventListener('input', () => { eventLog.textContent = `input event: ${field.name || field.id}`; });
      field.addEventListener('change', () => { eventLog.textContent += `\nchange event: ${field.name || field.id}`; });
      field.addEventListener('blur', () => { eventLog.textContent += `\nblur event: ${field.name || field.id}`; });
    });
    button.addEventListener('click', () => {
      eventLog.textContent = Array.from(trackedFields).map((f) => `${f.name || f.id}: ${f.value}`).join('\n');
    });
  </script>
</body>
</html>
